 <span id="changeImageText"> > next > </span>

<script>
  const images = [
    "images/portfolio/afb4.jpg",
    "images/portfolio/afb23.jpg",
    "images/portfolio/afb22.jpg",
     "images/portfolio/afb14.jpg",
    "images/portfolio/afb24.jpg",
    "images/portfolio/afb2.jpg",
    "images/portfolio/afb0.jpg",
    "images/portfolio/afb17.jpg",
    "images/portfolio/kim1.jpg",
    "images/portfolio/kim2.jpg",
    "images/portfolio/krant1.jpeg",
    "images/portfolio/krant2.jpeg",
    "images/portfolio/afb8.jpg",
    "images/portfolio/afb6.jpg",
    "images/portfolio/afb11.jpg",
    "images/portfolio/afb3.jpg",
    "images/portfolio/afb13.jpg",
    "images/portfolio/afb15.jpg",
    "images/portfolio/afb5.jpg",
    "images/portfolio/afb16.jpg",
    "images/portfolio/afb7.jpg"
  ];

  const img = document.getElementById("randomImage");
  const text = document.getElementById("changeImageText");

  let currentIndex = 0;

  // start direct met eerste image
  img.src = images[currentIndex];

  function showNextImage() {
    currentIndex++;

    if (currentIndex >= images.length) {
      currentIndex = 0;
    }

    img.src = images[currentIndex];
  }

  // Mobiel: knop
  if (text) {
    text.addEventListener("click", showNextImage);
  }
</script>
